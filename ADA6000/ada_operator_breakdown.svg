<text x="72.0" y="1092.0" font-size="14" font-weight="400" fill="#53616D" text-anchor="start">- This is a fresh analysis of existing traces, not a new benchmark.</text>
<text x="72.0" y="1114.0" font-size="14" font-weight="400" fill="#53616D" text-anchor="start">- Quantize/pack includes native prepare_integer&lt;4/8&gt; kernels.</text>
<text x="72.0" y="1136.0" font-size="14" font-weight="400" fill="#53616D" text-anchor="start">- Fused LN categories include normalization and quantization together.</text>
<text x="72.0" y="1158.0" font-size="14" font-weight="400" fill="#53616D" text-anchor="start">- T8 adds 16 norm/pack, 16 GEMM and 32 copy kernels per graph.</text>
